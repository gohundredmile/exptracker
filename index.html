<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
    <script id="env-fetch-getter-fix">
      // Fix for sandboxed iframe environments where window.fetch is read-only
      // and some polyfills during build/dependency resolution try to write to global.fetch.
      (function() {
        try {
          const customGlobal = Object.create(window);
          Object.defineProperty(customGlobal, 'fetch', {
            value: window.fetch ? window.fetch.bind(window) : undefined,
            writable: true,
            configurable: true
          });
          window.global = customGlobal;
        } catch (e) {
          console.warn('Failed to define custom global fetch boundary:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
